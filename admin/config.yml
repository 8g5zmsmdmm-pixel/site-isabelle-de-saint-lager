# Configuration de l'interface d'administration (Decap CMS)
# L'artiste se connecte sur /admin et modifie le contenu sans toucher au code.
# Tout est enregistré dans le dépôt Git du site (puis remis en ligne automatiquement).

backend:
  name: git-gateway
  branch: main            # adapter si la branche principale n'est pas "main"

# Dossier où sont déposées les photos téléversées depuis l'admin
media_folder: "images"
public_folder: "/images"

locale: "fr"

collections:
  # ---- Les œuvres ----
  - name: "oeuvres"
    label: "Œuvres"
    files:
      - name: "liste"
        label: "Catalogue des œuvres"
        file: "data/oeuvres.json"
        description: "Ajoutez, modifiez ou retirez vos tableaux."
        fields:
          - name: "oeuvres"
            label: "Tableaux"
            label_singular: "tableau"
            widget: "list"
            summary: "{{fields.titre}} ({{fields.annee}})"
            fields:
              - { name: "id", label: "Identifiant (sans espace, ex: lumiere-du-nord)", widget: "string", hint: "Une fois publié, ne plus le modifier." }
              - { name: "titre", label: "Titre", widget: "string" }
              - { name: "annee", label: "Année", widget: "number", value_type: "int", min: 1900, max: 2100 }
              - { name: "technique", label: "Technique", widget: "string", hint: "Ex : Huile sur toile de lin" }
              - { name: "largeur_cm", label: "Largeur (cm)", widget: "number", value_type: "int" }
              - { name: "hauteur_cm", label: "Hauteur (cm)", widget: "number", value_type: "int" }
              - { name: "prix", label: "Prix (EUR)", widget: "number", value_type: "int" }
              - { name: "statut", label: "Disponibilité", widget: "select", options: ["disponible", "vendu"], default: "disponible" }
              - { name: "description", label: "Description", widget: "text", required: false }
              - name: "images"
                label: "Photos (la première sert de vignette)"
                widget: "list"
                field: { name: "image", label: "Photo", widget: "image" }

  # ---- Textes du site ----
  - name: "site"
    label: "Site & présentation"
    files:
      - name: "general"
        label: "Page d'accueil et textes"
        file: "data/site.json"
        fields:
          - { name: "nom_artiste", label: "Nom de l'artiste", widget: "string" }
          - { name: "accroche", label: "Petite accroche (au-dessus du titre)", widget: "string" }
          - { name: "hero_titre", label: "Grand titre d'accueil", widget: "string" }
          - { name: "hero_sous_titre", label: "Sous-titre d'accueil", widget: "string" }
          - { name: "hero_image", label: "Image d'accueil (plein écran)", widget: "image" }
          - { name: "a_propos_titre", label: "Titre — section atelier", widget: "string" }
          - { name: "a_propos_texte", label: "Texte — section atelier", widget: "text", hint: "Laissez une ligne vide pour séparer les paragraphes." }
          - { name: "a_propos_image", label: "Photo — section atelier", widget: "image" }
          - { name: "philosophie_titre", label: "Titre — la démarche", widget: "string" }
          - { name: "philosophie_texte", label: "Texte — la démarche", widget: "text" }
          - { name: "email_contact", label: "Email de contact", widget: "string" }
          - { name: "telephone", label: "Téléphone (optionnel)", widget: "string", required: false }
          - { name: "ville_atelier", label: "Localisation de l'atelier", widget: "string" }
          - { name: "instagram", label: "Lien Instagram (optionnel)", widget: "string", required: false }
