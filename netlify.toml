# Déploiement Netlify - site Astro + TinaCMS
[build]
  command = "npm run build"
  publish = "dist"

# Variables d'environnement à définir dans Netlify (Site configuration > Environment variables) :
#   PUBLIC_TINA_CLIENT_ID  (fourni par Tina Cloud)
#   TINA_TOKEN             (fourni par Tina Cloud)
#   PUBLIC_TINA_BRANCH     = main

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
